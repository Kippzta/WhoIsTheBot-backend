quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_URL:http://localhost:4200}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.http.port=${PORT:8080}

# https://docs.quarkiverse.io/quarkus-langchain4j/dev/quickstart.html
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}

# Loggar det som skickas till och från AI:n, bara i dev-läge
%dev.quarkus.langchain4j.log-requests=true
%dev.quarkus.langchain4j.log-responses=true
quarkus.langchain4j.openai.chat-model.temperature=0.8
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini